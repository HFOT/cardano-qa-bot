<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Cardano Q&Aボット</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="chat-app">
    <header id="chat-header">
      <h1>Cardano Q&amp;Aボット</h1>
      <button id="home-btn" type="button">トップに戻る</button>
    </header>
    <section id="hero" aria-hidden="true">
      <div id="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle class="hero-mark-ring" cx="60" cy="60" r="34" fill="none" stroke-width="2.5"></circle>
          <circle class="hero-mark-node hero-mark-node--core" cx="60" cy="60" r="7"></circle>
          <circle class="hero-mark-node" cx="60" cy="16" r="5"></circle>
          <circle class="hero-mark-node" cx="98.2" cy="38" r="5"></circle>
          <circle class="hero-mark-node" cx="98.2" cy="82" r="5"></circle>
          <circle class="hero-mark-node" cx="60" cy="104" r="5"></circle>
          <circle class="hero-mark-node" cx="21.8" cy="82" r="5"></circle>
          <circle class="hero-mark-node" cx="21.8" cy="38" r="5"></circle>
          <line class="hero-mark-spoke" x1="60" y1="60" x2="60" y2="16"></line>
          <line class="hero-mark-spoke" x1="60" y1="60" x2="98.2" y2="38"></line>
          <line class="hero-mark-spoke" x1="60" y1="60" x2="98.2" y2="82"></line>
        </svg>
      </div>
      <h2 id="hero-title">Cardano <span id="hero-title-accent">Q&amp;A</span></h2>
      <p id="hero-subtitle">はじめての方でも大丈夫。ウォレットからDRep投票まで、知りたいことをやさしく道案内します。</p>
      <ul id="hero-chips">
        <li class="hero-chip">ウォレット</li>
        <li class="hero-chip">プール選び</li>
        <li class="hero-chip">DRep選び</li>
      </ul>
    </section>
    <div id="chat-log" role="log" aria-live="polite"></div>
    <div id="chat-options"></div>
    <form id="free-text-form">
      <input id="free-text-input" type="text" placeholder="気になることを入力(例: 手数料、シードフレーズ)" autocomplete="off">
      <button type="submit">送信</button>
    </form>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
