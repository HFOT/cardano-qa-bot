<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>What's Cardano?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="chat-app">
    <header id="chat-header">
      <h1>What's Cardano?</h1>
      <button id="home-btn" type="button">トップに戻る</button>
    </header>
    <section id="hero">
      <h2 id="hero-title">What's Cardano?</h2>
      <p id="hero-subtitle">はじめての方でも大丈夫。ウォレットからDRep投票まで、知りたいことをやさしく道案内します。</p>
    </section>
    <section id="promo">
      <a id="promo-card" href="https://hfot.github.io/holders-governance-skill/" target="_blank" rel="noopener">
        <span class="promo-label">Holders' Governance Skill</span>
        <span class="promo-title">研ぎ澄ませるための情報。</span>
        <span class="promo-desc">DRep・SPO・ガバナンスを数字で読むツール群。このボットの姉妹サイトです。</span>
        <span class="promo-open">開く ↗</span>
      </a>
    </section>
    <div id="chat-log" role="log" aria-live="polite"></div>
    <div id="chat-options"></div>
    <form id="free-text-form">
      <input id="free-text-input" type="text" placeholder="気になることを入力(例: 手数料、シードフレーズ)" autocomplete="off">
      <button type="submit">送信</button>
    </form>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
